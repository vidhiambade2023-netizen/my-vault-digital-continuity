<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyWise — Personal Finance Mobile Prototype</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Application Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Presentation Shell for Assignment Evaluation -->
  <div class="app-container">

    <!-- UX Control Panel for Micro-Interaction Testing -->
    <aside class="ux-control-panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
          MoneyWise Prototype
        </div>
        <div class="panel-subtitle">UX & Micro-Interaction Design Assignment Prototype (390 × 844 px)</div>
      </div>

      <div>
        <div class="panel-section-title">🎨 Figma Design Capture (34 States)</div>
        <select id="figma-state-select" class="figma-select-dropdown" onchange="setFigmaCaptureState(this.value)">
          <option value="" disabled selected>-- Select Figma State (1–34) --</option>
          <optgroup label="Dashboard & Add Expense Flow">
            <option value="1">01. Dashboard — Default</option>
            <option value="2">02. Add Expense — Default</option>
            <option value="3">03. Add Expense — Processing</option>
            <option value="4">04. Add Expense — Success</option>
            <option value="5">05. Add Expense — Final Transaction Added</option>
          </optgroup>
          <optgroup label="Budget States">
            <option value="6">06. Budget — Normal</option>
            <option value="7">07. Budget — Approaching Warning (>80%)</option>
            <option value="8">08. Budget — 100% Reached</option>
          </optgroup>
          <optgroup label="Transaction Processing Flow">
            <option value="9">09. Transaction Processing — Default</option>
            <option value="10">10. Transaction Processing — Processing</option>
            <option value="11">11. Transaction Processing — Success</option>
            <option value="12">12. Transaction Processing — Failure</option>
            <option value="13">13. Transaction Processing — Retry</option>
          </optgroup>
          <optgroup label="Duplicate Expense Flow">
            <option value="14">14. Duplicate Expense — Default</option>
            <option value="15">15. Duplicate Expense — Warning Modal</option>
            <option value="16">16. Duplicate Expense — Cancelled</option>
            <option value="17">17. Duplicate Expense — Kept Both</option>
          </optgroup>
          <optgroup label="Delete Transaction Flow">
            <option value="18">18. Delete Transaction — Default Detail View</option>
            <option value="19">19. Delete Transaction — Confirmation Modal</option>
            <option value="20">20. Delete Transaction — Deleted with Undo Toast</option>
            <option value="21">21. Delete Transaction — Restored</option>
          </optgroup>
          <optgroup label="Budget Saved Flow">
            <option value="22">22. Budget Saved — Editing (₹12,000)</option>
            <option value="23">23. Budget Saved — Saving...</option>
            <option value="24">24. Budget Saved — Saved ✓</option>
          </optgroup>
          <optgroup label="Offline Expense Flow">
            <option value="25">25. Offline Expense — Default Offline Form</option>
            <option value="26">26. Offline Expense — Offline Warning Modal</option>
            <option value="27">27. Offline Expense — Saved Offline Toast</option>
            <option value="28">28. Offline Expense — Waiting to Sync</option>
            <option value="29">29. Offline Expense — Synced ✓</option>
          </optgroup>
          <optgroup label="Category Suggestion Flow">
            <option value="30">30. Category Suggestion — Before Suggestion</option>
            <option value="31">31. Category Suggestion — Suggestion Visible</option>
            <option value="32">32. Category Suggestion — Category Confirmed</option>
          </optgroup>
          <optgroup label="Daily Spending Limit Flow">
            <option value="33">33. Daily Spending Limit — Normal (₹850 / 85%)</option>
            <option value="34">34. Daily Spending Limit — Exceeded (₹1,150 / 115%)</option>
          </optgroup>
        </select>
      </div>

      <div>
        <div class="panel-section-title">Viewport Display</div>
        <div class="view-mode-bar">
          <button id="view-btn-device" class="view-mode-btn active" onclick="togglePhoneFrameMode('device')">iPhone Frame</button>
          <button id="view-btn-full" class="view-mode-btn" onclick="togglePhoneFrameMode('fullscreen')">Frameless 390px</button>
        </div>
      </div>

      <div>
        <div class="panel-section-title">Navigation Quick Links</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
          <button class="preset-btn" onclick="store.setScreen('dashboard')"><span class="preset-btn-label">Dashboard</span></button>
          <button class="preset-btn" onclick="store.setScreen('add-expense')"><span class="preset-btn-label">Add Expense</span></button>
          <button class="preset-btn" onclick="store.setScreen('transactions')"><span class="preset-btn-label">Transactions</span></button>
          <button class="preset-btn" onclick="store.setScreen('budget')"><span class="preset-btn-label">Budget</span></button>
          <button class="preset-btn" onclick="store.setScreen('detail')"><span class="preset-btn-label">Detail</span></button>
          <button class="preset-btn" onclick="store.setScreen('settings')"><span class="preset-btn-label">Settings</span></button>
        </div>
        <button class="preset-btn" style="width: 100%; margin-top: 6px; background: #0F172A; border-color: #38BDF8;" onclick="store.setScreen('showcase')">
          <span class="preset-btn-label" style="color: #38BDF8; font-weight: 600;">📦 View 19 Reusable Components</span>
        </button>
      </div>

      <div>
        <div class="panel-section-title">10 Micro-Interaction Triggers</div>
        <div class="micro-interaction-list">
          <button class="preset-btn" onclick="triggerMicroInteraction(1)">
            <span class="preset-num">01</span>
            <span class="preset-btn-label">Add Expense</span>
            <span class="preset-badge">Form</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(2)">
            <span class="preset-num">02</span>
            <span class="preset-btn-label">Budget Warning</span>
            <span class="preset-badge">>80%</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(3)">
            <span class="preset-num">03</span>
            <span class="preset-btn-label">Transaction Processing</span>
            <span class="preset-badge">Spinner</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(4)">
            <span class="preset-num">04</span>
            <span class="preset-btn-label">Duplicate Expense</span>
            <span class="preset-badge">Alert</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(5)">
            <span class="preset-num">05</span>
            <span class="preset-btn-label">Delete Transaction</span>
            <span class="preset-badge">Modal</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(6)">
            <span class="preset-num">06</span>
            <span class="preset-btn-label">Budget Reached</span>
            <span class="preset-badge">100% Cap</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(7)">
            <span class="preset-num">07</span>
            <span class="preset-btn-label">Budget Saved</span>
            <span class="preset-badge">Toast</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(8)">
            <span class="preset-num">08</span>
            <span class="preset-btn-label">Offline Expense</span>
            <span class="preset-badge">Pill</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(9)">
            <span class="preset-num">09</span>
            <span class="preset-btn-label">Category Suggestion</span>
            <span class="preset-badge">Chip</span>
          </button>

          <button class="preset-btn" onclick="triggerMicroInteraction(10)">
            <span class="preset-num">10</span>
            <span class="preset-btn-label">Daily Spending Limit</span>
            <span class="preset-badge">Over Limit</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Mobile Viewport Frame (Exact 390px x 844px) -->
    <main id="phone-wrapper" class="phone-viewport-wrapper">
      
      <!-- iOS Notch / Dynamic Island -->
      <div class="phone-notch">
        <div class="notch-camera"></div>
      </div>

      <!-- Phone Status Bar -->
      <div class="phone-status-bar">
        <span class="status-bar-time">9:41</span>
        <div class="status-bar-icons">
          <!-- Signal Icon -->
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
            <rect x="0" y="8" width="2" height="3" rx="0.5"/>
            <rect x="4" y="6" width="2" height="5" rx="0.5"/>
            <rect x="8" y="3" width="2" height="8" rx="0.5"/>
            <rect x="12" y="0" width="2" height="11" rx="0.5"/>
          </svg>
          <!-- Wifi Icon -->
          <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor">
            <path d="M8 12L0 3.5C2.2 1.3 5 0 8 0s5.8 1.3 8 3.5L8 12z"/>
          </svg>
          <!-- Battery Icon -->
          <svg width="22" height="11" viewBox="0 0 22 11" fill="currentColor">
            <rect x="0" y="0" width="19" height="11" rx="2.5" fill-opacity="0.3"/>
            <rect x="1.5" y="1.5" width="13" height="8" rx="1.5"/>
            <path d="M20 4v3a1.5 1.5 0 0 0 1.5-1.5v0A1.5 1.5 0 0 0 20 4z"/>
          </svg>
        </div>
      </div>

      <!-- Toast Layer Container -->
      <div id="toast-container" class="toast-container"></div>
      <div id="toast-container-bottom" class="toast-container-bottom"></div>

      <!-- Active Application Screen -->
      <div id="app-screen" class="app-screen-container"></div>

      <!-- Phone Home Indicator -->
      <div class="phone-home-indicator"></div>
    </main>

  </div>

  <!-- Application Logic Scripts -->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
